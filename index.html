<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Profile Card | Amras Ahamed</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css">
</head>
<body>

<div class="profile">
    <div class="profile__card">

        <div class="profile__content">
            <img src="amras.jpeg" alt="Mohamed Yaseer" class="profile__img">

            <div class="profile__data">
                <h3 class="profile__name">Amras Ahamed </h3>
                <p class="profile__profession">Frontend Developer</p>
            </div>

            <div class="profile__button" id="profile-btn">
                <i class="fa-solid fa-bars menu"></i>
                <i class="fa-solid fa-xmark close"></i>
            </div>
        </div>

        <div class="profile__social" id="profile-social">
            <a href="#" class="profile__lnk"><span><i class="fa-solid fa-code"></i></span></a>
            <a href="#" class="profile__lnk"><span><i class="fa-brands fa-facebook-f"></i></span></a>
            <a href="#" class="profile__lnk"><span><i class="fa-brands fa-github"></i></span></a>
            <a href="#" class="profile__lnk"><span><i class="fa-brands fa-instagram"></i></span></a>
            <a href="#" class="profile__lnk"><span><i class="fa-brands fa-linkedin-in"></i></span></a>
        </div>

    </div>
</div>

<script src="index.js"></script>
</body>
</html>
